[project]
name = "tw3k-ai-assistant"
version = "0.1.0"
description = "Local retrieval-augmented assistant for TW3K transcript guidance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openai>=1.0.0",
    "pydantic>=2.13.4",
    "qdrant-client>=1.14.0",
    "sentence-transformers>=5.0.0",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured real Qdrant service",
]
