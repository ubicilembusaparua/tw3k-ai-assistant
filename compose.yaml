services:
  model-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/download.py"]
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
    volumes:
      - model_cache:/app/models

  qdrant-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "ingest_qdrant.py"]
    environment:
      DATASET_PATH: /app/tw3k_dataset.jsonl
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-tw3k_transcripts}
      QDRANT_BATCH_SIZE: ${QDRANT_BATCH_SIZE:-64}
      QDRANT_FORCE_REINDEX: ${QDRANT_FORCE_REINDEX:-false}
    volumes:
      - model_cache:/app/models:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tw3k_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-tw3k}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "db_init.py"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-tw3k_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-tw3k}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.18.3
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 &&
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  model_cache:
  postgres_data:
  qdrant_storage:
