<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TW3K Guide Assistant</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #f7efe0; background: #15120f; }
    main { width: min(900px, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0 5rem; }
    header { margin-bottom: 2rem; }
    h1 { margin: 0 0 .5rem; color: #e8b45d; font-size: clamp(2rem, 6vw, 3.5rem); }
    .subtitle { color: #bdb2a3; max-width: 62ch; }
    form, .panel { background: #211c18; border: 1px solid #493b2d; border-radius: 14px; padding: 1rem; }
    label { display: block; font-weight: 700; margin-bottom: .6rem; }
    textarea { width: 100%; min-height: 7rem; resize: vertical; border: 1px solid #6b5744; border-radius: 9px; padding: .85rem; color: #fff; background: #120f0d; font: inherit; }
    button { margin-top: .75rem; border: 0; border-radius: 9px; padding: .75rem 1.1rem; color: #1b140b; background: #e8b45d; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.5rem; margin: 1rem 0; color: #d6c6ae; }
    #status[data-kind="error"] { color: #ff9d91; }
    #status[data-kind="notice"] { color: #f5cf88; }
    #answer[hidden] { display: none; }
    .claim { line-height: 1.65; margin: 0 0 1rem; }
    .citations a, summary a { color: #f1bd64; }
    details { margin-top: .75rem; border-top: 1px solid #493b2d; padding-top: .75rem; }
    summary { cursor: pointer; font-weight: 700; }
    .excerpt { color: #cfc3b2; line-height: 1.55; white-space: pre-wrap; }
    @media (max-width: 560px) {
      main { width: min(100% - 1rem, 900px); padding-top: 1.25rem; }
      form, .panel { border-radius: 10px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>TW3K Guide Assistant</h1>
      <p class="subtitle">Ask about guidance in the indexed tutorial transcripts. Answers use only retrieved evidence and link to the exact YouTube moments.</p>
    </header>
    <form id="question-form">
      <label for="question">Your question</label>
      <textarea id="question" name="question" maxlength="1000" required placeholder="How should I manage food in the early game?"></textarea>
      <button id="submit" type="submit">Ask the transcripts</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="answer" class="panel" aria-live="polite" hidden>
      <h2>Grounded answer</h2>
      <div id="claims"></div>
      <h3>Sources</h3>
      <div id="sources"></div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#question-form');
    const question = document.querySelector('#question');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const answer = document.querySelector('#answer');
    const claims = document.querySelector('#claims');
    const sources = document.querySelector('#sources');
    let submitting = false;

    function setStatus(message, kind = '') {
      status.textContent = message;
      status.dataset.kind = kind;
    }

    function citationLink(source) {
      const link = document.createElement('a');
      link.textContent = `[${source.id}]`;
      link.href = source.timestamp_link;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      return link;
    }

    function render(payload) {
      claims.replaceChildren();
      sources.replaceChildren();
      const sourceMap = new Map(payload.sources.map(source => [source.id, source]));
      if (payload.status === 'insufficient_evidence') {
        const paragraph = document.createElement('p');
        paragraph.textContent = payload.text;
        claims.append(paragraph);
        setStatus('The index had no sufficiently relevant evidence.', 'notice');
      } else {
        payload.claims.forEach(claim => {
          const paragraph = document.createElement('p');
          paragraph.className = 'claim';
          paragraph.append(document.createTextNode(`${claim.text} `));
          const links = document.createElement('span');
          links.className = 'citations';
          claim.citation_ids.forEach(id => {
            const source = sourceMap.get(id);
            if (source) links.append(citationLink(source), document.createTextNode(' '));
          });
          paragraph.append(links);
          claims.append(paragraph);
        });
        setStatus('Answer ready. Every claim links to supplied evidence.');
      }
      payload.sources.forEach(source => {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.append(citationLink(source), document.createTextNode(` ${source.video_title} — ${source.formatted_time}`));
        const excerpt = document.createElement('p');
        excerpt.className = 'excerpt';
        excerpt.textContent = source.excerpt;
        details.append(summary, excerpt);
        sources.append(details);
      });
      answer.hidden = false;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (submitting) return;
      submitting = true;
      submit.disabled = true;
      answer.hidden = true;
      setStatus('Retrieving and checking transcript evidence…');
      try {
        const response = await fetch('/api/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question: question.value})
        });
        const payload = await response.json();
        if (!response.ok) {
          const code = payload.detail?.code;
          const messages = {
            empty_index: 'The transcript index is empty. Run the indexer first.',
            qdrant_error: 'Qdrant is unavailable. Check the local service.',
            openai_error: 'Answer generation is unavailable. Check OpenAI configuration and service status.',
            duplicate_submission: 'That question is already being processed.'
          };
          throw new Error(messages[code] || payload.detail?.message || 'The request failed.');
        }
        render(payload);
      } catch (error) {
        setStatus(error.message || 'The request failed.', 'error');
      } finally {
        submitting = false;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
