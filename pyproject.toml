[project]
name = "tw3k-ai-assistant"
version = "0.1.0"
description = "RAG retrieval learning suite comparing BM25, Vector, and Hybrid search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.14.0",
    "huggingface-hub>=0.20.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.28.0",
    "openai>=1.0.0",
    "qdrant-client>=1.9.0",
    "ragas>=0.1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.0",
    "streamlit>=1.61.1",
    "tokenizers>=0.22.2",
    "transformers>=4.41,<5",
    "tqdm>=4.70.0",
    "psycopg[binary]>=3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
