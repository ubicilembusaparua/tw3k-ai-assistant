[project]
name = "tw3k-ai-assistant"
version = "0.1.0"
description = "Total War: Three Kingdoms YouTube RAG Dataset Builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.7.4",
    "rich>=15.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "pydantic>=2.13.4",
    "pandas>=3.0.5",
    "jinja2>=3.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

